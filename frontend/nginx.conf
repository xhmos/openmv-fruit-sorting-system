# 前端 Nginx 站点配置（容器内）
# 作用：托管前端打包静态文件，并把接口 / 实时流 / 上传图片反代到后端容器。

upstream fruit_backend {
    # 后端容器在同一个 compose 网络里，用服务名 backend 访问，端口 5000
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    # 与后端 MAX_CONTENT_LENGTH（3MB）保持一致，避免大图被 Nginx 先拦
    client_max_body_size 3m;

    # ---------- 前端静态页面（hash 路由兜底） ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- REST 接口 ----------
    location /api/ {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- MJPEG 实时流（长连接，关闭缓冲，画面才连续） ----------
    location /api/device/stream {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---------- 上传的分拣图片 ----------
    location /uploads/ {
        proxy_pass http://fruit_backend;
        proxy_set_header Host $host;
        expires 60s;
    }

    # ---------- Socket.IO（必须支持 WebSocket 协议升级） ----------
    location /socket.io/ {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
