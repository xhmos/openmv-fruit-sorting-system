# 前端 Nginx 站点配置（容器内）
# 作用：托管前端打包静态文件，并把接口 / 实时流 / 上传图片反代到后端容器。

upstream fruit_backend {
    # 后端容器在同一个 compose 网络里，用服务名 backend 访问，端口 5000
    server backend:5000;
}

# 只把「网关层直接拒绝」的畸形请求写进审计日志：
# 这些请求到不了 Flask（Nginx 在 URI 规范化阶段就 400 了），
# 但它们恰恰是最典型的路径穿越探测，必须留证据给安全中心。
map $status $audit_abnormal {
    ~^(400|444)$ 1;
    default 0;
}

log_format audit '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
access_log /var/log/nginx/audit/access.log audit if=$audit_abnormal;

server {
    listen 80;
    server_name _;

    # 不向外界暴露 Nginx 版本号
    server_tokens off;

    # 与后端 MAX_CONTENT_LENGTH（3MB）保持一致，避免大图被 Nginx 先拦
    client_max_body_size 3m;

    # ---------- 安全响应头 ----------
    # 这几条对页面和接口都生效，且不影响现有功能：
    #   nosniff        禁止浏览器猜 MIME，防止上传文件被当成脚本执行
    #   SAMEORIGIN     禁止别的站点 iframe 嵌入，防点击劫持
    #   CSP            只允许同源脚本/图片；style 留 unsafe-inline 是 Element Plus 需要
    #   connect-src    放 ws:/wss: 是 Socket.IO 实时推送
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ---------- 敏感路径探测：转发给后端，拿到正常 404 并留证据 ----------
    # 下面的 location / 是 try_files 兜底，会把 /.env、/wp-login.php 这类请求
    # 也返回 index.html（200）。扫描器看到 200 会以为文件真的存在，继续深挖；
    # 所以这里把常见探测路径转给后端：后端返回 404（不是 200，也不泄露内容），
    # 同时 utils/security_guard.py 的特征库会把来源 IP、路径、次数记进安全中心。
    location ~* "(/\.(env|git|svn|hg|htaccess|aws|ds_store)|wp-login|wp-admin|phpmyadmin|xmlrpc\.php|/etc/passwd|phpinfo|actuator|config\.json)" {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 前端静态页面（hash 路由兜底） ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- REST 接口 ----------
    location /api/ {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 用 $remote_addr 覆盖而不是 $proxy_add_x_forwarded_for：
        # 后者会把客户端自带的 X-Forwarded-For 原样保留，攻击者随手伪造一个 IP
        # 就能绕开按 IP 的登录限流，也会把安全中心里的来源 IP 写脏。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- MJPEG 实时流（长连接，关闭缓冲，画面才连续） ----------
    location /api/device/stream {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---------- 上传的分拣图片 ----------
    location /uploads/ {
        proxy_pass http://fruit_backend;
        proxy_set_header Host $host;
        expires 60s;
    }

    # ---------- Socket.IO（必须支持 WebSocket 协议升级） ----------
    location /socket.io/ {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
